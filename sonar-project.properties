# ===================================================================
# Configuración SonarQube para Nexus Cultural (RNF-19: Densidad <= 10 def/KLOC)
# ===================================================================
sonar.projectKey=Nexus-Cultural-Backend
sonar.projectName=Nexus Cultural - Backend API
sonar.projectVersion=0.0.1-SNAPSHOT

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

sonar.sourceEncoding=UTF-8
sonar.java.source=21

# Cobertura de pruebas con JaCoCo
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusiones de análisis (DTOs, Configs y Entidades simples)
sonar.exclusions=**/dto/**,**/config/**,**/entity/**

