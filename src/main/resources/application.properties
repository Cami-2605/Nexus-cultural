spring.application.name=nexuscultural

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Clave de JWT leída desde la variable de entorno
jwt.secret=${JWT_SECRET}

# Ruta a la clave de servicio de Firebase
#firebase.config.path=${FIREBASE_CONFIG_PATH}
firebase.config.path=classpath:firebase-key-nexus-cultural-sevicio-correo.json

#aws imagenes
aws.s3.credentials-path=classpath:nexus-backend-service_accessKeys.csv
aws.s3.region=us-east-1
aws.s3.bucket=nexus-cultural-media-2026

# Conexión a PostgreSQL
# Base de datos utilizando Variables de Entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# "update" creará/actualizará automáticamente las tablas de Artesano y Comprador a partir de tus @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

